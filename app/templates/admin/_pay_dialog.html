{% import "macros.html" as ui with context %}
{% call ui.sheet('payDlg', 'Record payment') %}
<form method="post" action="#">
  {{ ui.csrf_field() }}<input type="hidden" name="back" value="">
  <p class="small muted" style="margin-top:0" data-text="who"></p>
  <label for="pay-amt">Amount (₹)</label><input id="pay-amt" name="amount" type="number" min="1" step="0.01" required>
  <label>Method</label>
  <div class="checks">{% for m in ['UPI', 'Cash', 'Cheque', 'Bank'] %}<label><input type="radio" name="method" value="{{ m }}" {{ 'checked' if loop.first }}> {{ m }}</label>{% endfor %}</div>
  <label for="pay-ref">Reference <span class="muted">(UTR for UPI · cheque no.)</span></label>
  <input id="pay-ref" name="reference" maxlength="80" placeholder="e.g. 412345678901">
  <button class="btn block success" style="margin-top:14px">✓ Record & create receipt</button>
</form>
{% endcall %}
